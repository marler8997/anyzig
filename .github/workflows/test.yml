name: Test
on: [pull_request, workflow_dispatch]
jobs:
  test:
    strategy:
      matrix:
        include:
          - os: windows-latest
          - os: windows-11-arm
          - os: macos-15 # TODO: change back to macos-latest once we upgrade to zig 0.17.0
          - os: ubuntu-latest
      fail-fast: false
    runs-on: ${{matrix.os}}
    steps:
      - uses: actions/checkout@v4
      - if: ${{ startsWith(matrix.os, 'macos') }}
        name: select xcode
        # zig 0.14.0 can't link against the newer Xcode SDKs (undefined libSystem symbols)
        run: |
          ls -d /Applications/Xcode*
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcrun --show-sdk-path
      - uses: mlugg/setup-zig@v2
      - run: |
          zig build install test --summary all
