name: Artifacts
on: [pull_request, workflow_dispatch]
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
          - os: windows-11-arm
          - os: macos-15 # TODO: change back to macos-latest once we upgrade to zig 0.17.0
          - os: ubuntu-latest
      fail-fast: false
    runs-on: ${{matrix.os}}
    steps:
      - uses: actions/checkout@v4
      - if: ${{ startsWith(matrix.os, 'macos') }}
        name: select xcode
        # zig 0.14.0 can't link against the newer Xcode SDKs (undefined libSystem symbols)
        run: |
          ls -d /Applications/Xcode*
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcrun --show-sdk-path
      - uses: mlugg/setup-zig@v2
      - run: |
          zig build ci --summary all
      - if: ${{ matrix.os == 'ubuntu-latest' }}
        name: getversion
        id: version
        run: echo "version=$(cat zig-out/version-release)" >> $GITHUB_OUTPUT
      - if: ${{ matrix.os == 'ubuntu-latest' }}
        uses: actions/upload-artifact@v4
        with:
          name: anyzig-${{ steps.version.outputs.version }}-archives
          path: |
            zig-out/anyzig-aarch64-linux.tar.gz
            zig-out/anyzig-aarch64-macos.tar.gz
            zig-out/anyzig-aarch64-windows.zip
            zig-out/anyzig-arm-linux.tar.gz
            zig-out/anyzig-powerpc64le-linux.tar.gz
            zig-out/anyzig-riscv64-linux.tar.gz
            zig-out/anyzig-s390x-linux.tar.gz
            zig-out/anyzig-x86-linux.tar.gz
            zig-out/anyzig-x86-windows.zip
            zig-out/anyzig-x86_64-linux.tar.gz
            zig-out/anyzig-x86_64-macos.tar.gz
            zig-out/anyzig-x86_64-windows.zip
