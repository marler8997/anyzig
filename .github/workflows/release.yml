name: Release
on: [pull_request, workflow_dispatch]
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: marler8997/setup-anyzig@master
      - run: |
          zig build release --summary all
      - name: getversion
        id: version
        run: echo "version=$(cat zig-out/version-release)" >> $GITHUB_OUTPUT
      - uses: actions/upload-artifact@v7
        with:
          name: anyzig-${{ steps.version.outputs.version }}-archives
          path: |
            zig-out/anyzig-aarch64-linux.tar.gz
            zig-out/anyzig-aarch64-macos.tar.gz
            zig-out/anyzig-aarch64-windows.zip
            zig-out/anyzig-arm-linux.tar.gz
            zig-out/anyzig-powerpc64le-linux.tar.gz
            zig-out/anyzig-riscv64-linux.tar.gz
            zig-out/anyzig-s390x-linux.tar.gz
            zig-out/anyzig-x86-linux.tar.gz
            zig-out/anyzig-x86-windows.zip
            zig-out/anyzig-x86_64-linux.tar.gz
            zig-out/anyzig-x86_64-macos.tar.gz
            zig-out/anyzig-x86_64-windows.zip
            zig-out/anyzls-aarch64-linux.tar.gz
            zig-out/anyzls-aarch64-macos.tar.gz
            zig-out/anyzls-aarch64-windows.zip
            zig-out/anyzls-arm-linux.tar.gz
            zig-out/anyzls-powerpc64le-linux.tar.gz
            zig-out/anyzls-riscv64-linux.tar.gz
            zig-out/anyzls-s390x-linux.tar.gz
            zig-out/anyzls-x86-linux.tar.gz
            zig-out/anyzls-x86-windows.zip
            zig-out/anyzls-x86_64-linux.tar.gz
            zig-out/anyzls-x86_64-macos.tar.gz
            zig-out/anyzls-x86_64-windows.zip
